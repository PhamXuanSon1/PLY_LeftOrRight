<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppLovin Analytics Test - Local Mock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 30px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .status {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
        }
        
        .status.available {
            background: #d4edda;
            color: #155724;
        }
        
        .status.unavailable {
            background: #f8d7da;
            color: #721c24;
        }
        
        .section {
            margin-bottom: 20px;
        }
        
        .section-title {
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }
        
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }
        
        .btn-loading {
            background: #17a2b8;
            color: white;
        }
        
        .btn-loading:hover {
            background: #138496;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(23, 162, 184, 0.4);
        }
        
        .btn-challenge {
            background: #28a745;
            color: white;
        }
        
        .btn-challenge:hover {
            background: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.4);
        }
        
        .btn-progress {
            background: #ffc107;
            color: #333;
        }
        
        .btn-progress:hover {
            background: #e0a800;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 193, 7, 0.4);
        }
        
        .btn-complete {
            background: #dc3545;
            color: white;
        }
        
        .btn-complete:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        
        .btn-cta {
            background: #6610f2;
            color: white;
            grid-column: 1 / -1;
        }
        
        .btn-cta:hover {
            background: #520dc2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 16, 242, 0.4);
        }
        
        .log {
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding: 5px;
            border-radius: 4px;
            background: white;
        }
        
        .log-entry.success {
            color: #28a745;
            border-left: 3px solid #28a745;
            padding-left: 10px;
        }
        
        .log-entry.error {
            color: #dc3545;
            border-left: 3px solid #dc3545;
            padding-left: 10px;
        }
        
        .log-entry.info {
            color: #17a2b8;
            border-left: 3px solid #17a2b8;
            padding-left: 10px;
        }
        
        .clear-btn {
            width: 100%;
            margin-top: 10px;
            background: #6c757d;
            color: white;
            padding: 10px;
        }
        
        .clear-btn:hover {
            background: #5a6268;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            font-size: 13px;
            color: #1565c0;
        }
        
        .info-box strong {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 AppLovin Analytics Test</h1>
        
        <div class="status available" id="status">
            ✅ ALPlayableAnalytics is available
        </div>
        
        <div class="info-box">
            <strong>📌 How to use:</strong>
            Click the buttons below to simulate AppLovin Analytics events. Check the log and browser console (F12) to verify events are being tracked.
        </div>
        
        <!-- Loading Events -->
        <div class="section">
            <div class="section-title">📥 Loading Events</div>
            <div class="button-group">
                <button class="btn-loading" onclick="trackLoading()">LOADING</button>
                <button class="btn-loading" onclick="trackLoaded()">LOADED</button>
            </div>
        </div>
        
        <!-- Challenge Events -->
        <div class="section">
            <div class="section-title">🎮 Challenge Events</div>
            <div class="button-group">
                <button class="btn-challenge" onclick="trackChallengeStarted()">START</button>
                <button class="btn-complete" onclick="trackChallengeFailed()">FAILED</button>
                <button class="btn-complete" onclick="trackChallengeRetry()">RETRY</button>
                <button class="btn-challenge" onclick="trackChallengeSolved()">SOLVED</button>
            </div>
        </div>
        
        <!-- Progress Events -->
        <div class="section">
            <div class="section-title">📈 Progress Tracking</div>
            <div class="button-group">
                <button class="btn-progress" onclick="trackPass(25)">25%</button>
                <button class="btn-progress" onclick="trackPass(50)">50%</button>
                <button class="btn-progress" onclick="trackPass(75)">75%</button>
                <button class="btn-progress" onclick="trackEndcard()">ENDCARD</button>
            </div>
        </div>
        
        <!-- CTA Event -->
        <div class="section">
            <div class="section-title">💰 Conversion</div>
            <button class="btn-cta" onclick="trackCTA()">🔗 CTA_CLICKED</button>
        </div>
        
        <!-- Log Display -->
        <div class="section">
            <div class="section-title">📋 Event Log</div>
            <div class="log" id="log"></div>
            <button class="clear-btn" onclick="clearLog()">Clear Log</button>
        </div>
    </div>
    
    <script>
        // Mock AppLovin SDK
        window.ALPlayableAnalytics = {
            trackEvent: function(eventName) {
                addLog(`[ALPlayableAnalytics] Event tracked: ${eventName}`, 'success');
                console.log(`[AppLovin Analytics Test] ${eventName}`);
                console.log(`Timestamp: ${new Date().toISOString()}`);
            }
        };
        
        // Event tracking functions
        function trackEvent(eventName) {
            if (typeof window.ALPlayableAnalytics !== 'undefined') {
                window.ALPlayableAnalytics.trackEvent(eventName);
            } else {
                addLog(`[ERROR] ALPlayableAnalytics not available!`, 'error');
            }
        }
        
        function trackLoading() {
            addLog('User clicked: LOADING', 'info');
            trackEvent('LOADING');
        }
        
        function trackLoaded() {
            addLog('User clicked: LOADED', 'info');
            trackEvent('LOADED');
        }
        
        function trackChallengeStarted() {
            addLog('User clicked: CHALLENGE_STARTED', 'info');
            trackEvent('CHALLENGE_STARTED');
        }
        
        function trackChallengeFailed() {
            addLog('User clicked: CHALLENGE_FAILED', 'info');
            trackEvent('CHALLENGE_FAILED');
        }
        
        function trackChallengeRetry() {
            addLog('User clicked: CHALLENGE_RETRY', 'info');
            trackEvent('CHALLENGE_RETRY');
        }
        
        function trackChallengeSolved() {
            addLog('User clicked: CHALLENGE_SOLVED', 'info');
            trackEvent('CHALLENGE_SOLVED');
        }
        
        function trackPass(percent) {
            const eventName = `CHALLENGE_PASS_${percent}`;
            addLog(`User clicked: ${eventName}`, 'info');
            trackEvent(eventName);
        }
        
        function trackEndcard() {
            addLog('User clicked: ENDCARD_SHOWN', 'info');
            trackEvent('ENDCARD_SHOWN');
        }
        
        function trackCTA() {
            addLog('User clicked: CTA_CLICKED', 'info');
            trackEvent('CTA_CLICKED');
        }
        
        // Logging functions
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            logDiv.insertBefore(entry, logDiv.firstChild);
            
            // Keep only last 20 logs
            while (logDiv.children.length > 20) {
                logDiv.removeChild(logDiv.lastChild);
            }
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
            addLog('Log cleared', 'info');
        }
        
        // Initialize
        window.addEventListener('load', function() {
            addLog('🚀 AppLovin Analytics Test Started', 'success');
            addLog(`Available: ${typeof window.ALPlayableAnalytics !== 'undefined'}`, 'info');
            
            // Auto track DISPLAYED on load (recommended)
            setTimeout(function() {
                trackEvent('DISPLAYED');
                addLog('⚡ Auto tracked: DISPLAYED', 'success');
            }, 500);
        });
        
        // Log console messages to UI
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
        };
    </script>
</body>
</html>
